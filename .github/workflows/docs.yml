# Docs are checked on every PR, not only PRs that touch markdown: a code change
# is what moves the line a doc links to.
name: docs

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Links and heading anchors
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          fail: true
          args: >-
            --offline --include-fragments --no-progress
            --exclude '#L[0-9]'
            --exclude-path docs/design
            --exclude-path app/build
            --exclude-path .dart_tool
            --exclude-path node_modules
            '**/*.md'

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      # mermaid-cli's headless Chrome needs these; Forgejo's container image
      # lacks them (GitHub's runner image has them).
      - name: Chrome libraries
        run: |
          ldconfig -p | grep -q libnspr4 && exit 0
          apt-get update -qq
          apt-get install -y -qq libnspr4 libnss3 libatk1.0-0t64 libatk-bridge2.0-0t64 libcups2t64 libdrm2 \
            libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libpango-1.0-0 libcairo2 libasound2t64 >/dev/null

      - name: Line anchors, mermaid, and links into changed code
        env:
          DOCS_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
        run: scripts/docs-check.sh
