# Commit rules over base..head only: Conventional subjects, no AI attribution
# of any kind (CLAUDE.md). Re-runs when the PR title or body changes.
name: trailers

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  trailers:
    uses: MohammadBnei/ukubi-ci/.github/workflows/trailers.yml@d683f2091575188024f7e1200e619977d9db19ae # ukubi-ci PR 28 head; re-pin to the release
    with:
      conventional: true
      agent-trailers: forbid
      # Unanchored, as the old check-commits.sh: attribution mid-line or indented.
      # Scoped to a vendor name so a body describing the rule still passes.
      extra-banned: 'generated (with|by).*(claude|anthropic)|co-authored-by:.*(claude|anthropic)'
