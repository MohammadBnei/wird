# Push to main -> checks.yml (the Go half of the gate) -> ukubi-ci release.yml
# (git-cliff: next vX.Y.Z from Conventional Commits, CHANGELOG.md, a
# `chore(release)` commit and the tag, pushed atomically) -> build wird-api and
# wird-adminweb from that release commit with the version as a build-arg ->
# pin both helm values files to <sha>@<digest> in one commit so ArgoCD reconciles. Same shape and
# the same hard-won details as editable-blog's and drop's workflows, now kept in
# ukubi-ci's image.yml and deploy.yml (buildah via sudo -n, Infisical OIDC password,
# digest-pinned bump, stale-run guard). Registry, runner and tag handling live there.
#
# WHAT THE GATE IS, AND WHICH HALF RUNS HERE. `./scripts/qa.sh` is Wird's gate
# and its exit code is the verdict — but it cannot run on a GitHub runner, and
# running a crippled version of it under its own name would be worse than not
# running it. Of its seven gates:
#
#   gate 1  Go build, vet and test against a real Postgres 18   -> RUNS in checks.yml
#   gate 7  the marker/issue check and the corpus size budget   -> RUNS in checks.yml
#   gate 2  flutter analyze + flutter test                      -> needs fvm
#   gate 3  the e2e journeys                                    -> needs a simulator or a phone
#   gate 4-6 the per-screen, test-meaning and comment audits    -> human judgment
#
# Gates 2 and 3 need an fvm-managed Flutter toolchain and a device, and the
# only self-hosted runner in this estate is a build LXC with no cluster access
# and no simulator. So the image gate is gate 1 plus the two gate-7 checks that
# are pure shell, and the Flutter half stays what it already is: `./scripts/qa.sh`
# on a developer's machine before the push. A macOS runner is what would change
# that, and nothing here pretends otherwise.
#
# ONE VERSION LINE (ADR 0041). The release job cuts the version; the image
# keeps its SHA tag (the helm values pin it) and carries the version as
# org.opencontainers.image.version and in what both binaries say on their start
# line and at /version. The Flutter app ships the same tags: release-app.yml
# builds the latest one and never tags. The tags stay `v*`, which the app
# workflows' Infisical identities are bound to.
#
# WHAT THE PATH FILTERS COST. A push touching only Markdown or helm/ gets no
# run, so nothing releases it. And when one lands while a code commit's run is
# in flight, that run sees a human commit past its own and releases nothing
# (ukubi-ci: "the run for the newer commits releases them"), which never comes.
# Either way the next code push releases it all, or now, by hand:
#
#   gh workflow run release.yml --ref main
#
# A dispatch on main releases, builds AND deploys, like a push. A dispatch on
# any other branch is a dry run: it builds that branch's image with version
# X.Y.Z-dev+<sha> and neither tags nor deploys.
name: release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      # The deploy job's own bump touches helm/. Pushes made with the built-in
      # GITHUB_TOKEN do not trigger workflows either, so the loop is closed
      # twice — the same belt and braces editable-blog uses.
      - '**.md'
      - 'helm/**'
    tags-ignore:
      - '*'

# Two pushes racing would build two images and bump values.yaml twice, and the
# loser's bump would point at the older of the two. Keep the newest. Keyed on
# the ref: a dry-run dispatch on a branch must not cancel main's run after its
# release is tagged, leaving a release nobody built.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The Go half of the gate, shared with PRs.
  checks:
    uses: ./.github/workflows/checks.yml

  # A real release only on main (push or dispatch); anywhere else a dry run
  # whose summary says what it would release. Its failure stops the build: an
  # image with no version to name is not shipped.
  release:
    needs: checks
    permissions:
      contents: write # pushes the chore(release) commit and the tag
    uses: MohammadBnei/ukubi-ci/.github/workflows/release.yml@8782d42e1d4e5cd0b8af9d1a14c9d5414976a4c9 # v0.7.0

  # Build and push live in ukubi-ci's image.yml, once per image, with
  # deploy: false; one deploy.yml job then pins both digests in ONE commit, so
  # ArgoCD rolls wird-api and wird-adminweb out together and only when both
  # builds succeeded. Both build from the release commit (`ref`) with the
  # version as the VERSION build arg. image.yml's nested jobs check
  # contents: write + id-token: write on the caller even with deploy: false
  # (the Infisical OIDC login); deploy.yml needs contents: write for the bump.
  # Only main deploys; a dispatch on another branch builds and pushes only.
  #
  # image-adminweb still needs image-api: the shared build stage is reused from
  # the --layers cache instead of compiling twice, and pull-newer: false reuses
  # the base image api just refreshed rather than pulling again. The deploy
  # waits for both anyway, so the chain costs only wall time, not atomicity.
  image-api:
    needs: release
    permissions:
      contents: write
      id-token: write
    uses: MohammadBnei/ukubi-ci/.github/workflows/image.yml@8782d42e1d4e5cd0b8af9d1a14c9d5414976a4c9 # v0.7.0
    with:
      # NOT `ukubi`: that label belongs to the runner holding a ServiceAccount
      # token with cluster access. This one has none (infra-bootstrap ADR-0034).
      runs-on: '["self-hosted","ukubi-build"]'
      image: wird-api
      target: api
      ref: ${{ needs.release.outputs.tag }}
      version: ${{ needs.release.outputs.version }}
      version-arg: true
      cancel-in-progress: false
      deploy: false

  image-adminweb:
    needs: [release, image-api]
    permissions:
      contents: write
      id-token: write
    uses: MohammadBnei/ukubi-ci/.github/workflows/image.yml@8782d42e1d4e5cd0b8af9d1a14c9d5414976a4c9 # v0.7.0
    with:
      runs-on: '["self-hosted","ukubi-build"]'
      image: wird-adminweb
      target: adminweb
      ref: ${{ needs.release.outputs.tag }}
      version: ${{ needs.release.outputs.version }}
      version-arg: true
      cancel-in-progress: false
      pull-newer: false
      deploy: false

  # Skipped unless both builds succeed: never one image without the other.
  # Both build the same ref, so api's commit is the built commit of both.
  deploy:
    needs: [image-api, image-adminweb]
    permissions:
      contents: write
    uses: MohammadBnei/ukubi-ci/.github/workflows/deploy.yml@8782d42e1d4e5cd0b8af9d1a14c9d5414976a4c9 # v0.7.0
    with:
      built-commit: ${{ needs.image-api.outputs.commit }}
      pins: |
        helm/values.yaml ${{ needs.image-api.outputs.tag }}@${{ needs.image-api.outputs.digest }}
        helm/adminweb-values.yaml ${{ needs.image-adminweb.outputs.tag }}@${{ needs.image-adminweb.outputs.digest }}
