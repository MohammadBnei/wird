# The Go half of the gate. PRs run it directly; release.yml calls it before
# building an image. The Flutter half is app-checks.yml; the commit-message
# rules are trailers.yml. Reusable jobs live in MohammadBnei/ukubi-ci, pinned
# by sha (v0.2.1).
name: checks

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ponytail: gofmt and vet run before pre-test with no GOWORK=off (ukubi-ci
  # has no env input). No go.work is in git (gitignored at any depth), and the
  # pre-test build and go test run with GOWORK=off and GOTOOLCHAIN=local, as
  # qa.sh does, so a stray go.work still fails there. Upgrade: an env input in
  # ukubi-ci.
  server:
    uses: MohammadBnei/ukubi-ci/.github/workflows/go-checks.yml@e784a69d5fe0b258b1b6899f89d42ee87eb89d5c # v0.2.1
    with:
      working-directory: server
      test-flags: '-p 1'
      pre-test: |
        docker compose up -d --wait postgres
        export GOWORK=off GOTOOLCHAIN=local
        echo GOWORK=off >> "$GITHUB_ENV"
        echo GOTOOLCHAIN=local >> "$GITHUB_ENV"
        go -C server build ./...

  jidhr:
    uses: MohammadBnei/ukubi-ci/.github/workflows/go-checks.yml@e784a69d5fe0b258b1b6899f89d42ee87eb89d5c # v0.2.1
    with:
      working-directory: jidhr
      test-flags: '-p 1'
      pre-test: |
        export GOWORK=off GOTOOLCHAIN=local
        echo GOWORK=off >> "$GITHUB_ENV"
        echo GOTOOLCHAIN=local >> "$GITHUB_ENV"
        go -C jidhr build ./...

  # Gate 7's shell-only half, lifted from scripts/qa.sh.
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      # The marker is assembled from two pieces so this file is not its own
      # first hit.
      - name: Every marker carries an issue number
        run: |
          set -uo pipefail
          marker='TO'"DO"
          hits=$(git grep -I -n --untracked -F -e "$marker" -- . ':!CONTRIBUTING.md' | grep -vF "$marker(#") || true
          [ -z "$hits" ] || { echo "::error::a marker with no issue number behind it never comes back"; echo "$hits"; exit 1; }

      # The 60 MB budget decides whether the bundled-corpus split works at all.
      - name: corpus.db under budget
        run: |
          set -euo pipefail
          bytes=$(wc -c <app/assets/corpus.db)
          [ "$bytes" -le $((60 * 1024 * 1024)) ] || { echo "::error::corpus.db is $bytes bytes, over the 60 MB release budget"; exit 1; }

  # Build only, no push, on GitHub-hosted runners. On a push to main
  # release.yml's build-push job builds and pushes the same two targets.
  image-api:
    if: github.event_name == 'pull_request'
    uses: MohammadBnei/ukubi-ci/.github/workflows/image-build.yml@e784a69d5fe0b258b1b6899f89d42ee87eb89d5c # v0.2.1
    with:
      image: wird-api
      target: api

  image-adminweb:
    if: github.event_name == 'pull_request'
    uses: MohammadBnei/ukubi-ci/.github/workflows/image-build.yml@e784a69d5fe0b258b1b6899f89d42ee87eb89d5c # v0.2.1
    with:
      image: wird-adminweb
      target: adminweb
