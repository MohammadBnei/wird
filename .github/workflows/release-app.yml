# The release button: Actions -> release-app -> Run workflow, on main. The one
# way an APK reaches /download/android.
#
#   app-checks (analyze + tests)
#     -> the latest vX.Y.Z tag on main, cut by release.yml (ADR 0041)
#     -> dispatch apk.yml (and ipa.yml) on that tag: build, sign, upload, publish
#
# Nothing is typed and nothing is tagged here: release.yml's git-cliff job owns
# the one version line, server and app alike, and this button ships the newest
# release of it. The build name is the tag, the build number the commit count
# at the tag, so it always rises (Android refuses an update whose version code
# does not).
#
# It refuses two things. Commits on main past the tag that are not bots' own:
# they are not released yet, and shipping the tag would leave them out while
# the app claimed to be current. And a tag already published: pressing twice
# would rebuild the same version under the same build number, which the stores
# reject.
#
# WHY A DISPATCH AND NOT THE TAG PUSH. A tag pushed with the built-in
# GITHUB_TOKEN starts no workflow; a workflow_dispatch is the one event that
# token may start. Run on the tag's ref, apk.yml sees ref_type == tag and
# publishes, and the Infisical identity, bound to apk.yml from a tag or from
# main, accepts it exactly as it accepted a tag push. ADR 0022.
name: release-app

on:
  workflow_dispatch:

# Two presses at once would dispatch the same tag twice.
concurrency:
  group: release-app
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Run from any other branch, the jobs below would be skipped and the run
  # would end green having done nothing. Say so instead.
  on-main:
    runs-on: ubuntu-latest
    steps:
      - if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::release-app runs on main only, not ${GITHUB_REF_NAME}"
          exit 1

  checks:
    needs: on-main
    uses: ./.github/workflows/app-checks.yml

  release:
    needs: checks
    runs-on: ubuntu-latest
    # Reads tags and dispatches; writes nothing to the repository.
    permissions:
      contents: read
      actions: write
    steps:
      # The commit the checks ran on, with every tag.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: The release to ship
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=$(git describe --tags --abbrev=0 --match 'v[0-9]*' HEAD 2>/dev/null) || tag=''
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] \
            || { echo "::error::no vX.Y.Z tag on main (got '$tag'); release.yml cuts them"; exit 1; }
          # The commits release.yml and apk.yml push themselves; anything else
          # past the tag is work no release holds yet. A copy of `bots` in the
          # ukubi-ci release.yml that release.yml pins (and of its git-cliff
          # skip list): change both when bumping that pin.
          bots='^(chore\((release|deploy)\)|chore: update helm image tag)'
          if unreleased=$(git log --format=%s "$tag..HEAD" | grep -vE "$bots"); then
            echo "::error::main has commits past $tag that no release holds. Wait for release.yml, or if they touch only Markdown or helm/ (no run of their own): gh workflow run release.yml --ref main, then press this again."
            echo "$unreleased"
            exit 1
          fi
          published=$(sed -n -E '/^  - name: WIRD_APK_VERSION$/{n;s/^    value: "(.*)"$/\1/p;}' helm/values.yaml)
          [ "$published" != "${tag#v}" ] \
            || { echo "::error::$tag is already published at /download/android; a new release comes from release.yml"; exit 1; }
          # values.yaml names the tag only once apk.yml's publish step pushes,
          # minutes after this button dispatched it. A run on the tag that is
          # queued, running or green means it is already shipping; only a failed
          # or cancelled one leaves it to ship again.
          inflight=$(gh run list --workflow apk.yml --branch "$tag" --limit 20 --json conclusion \
            --jq '[.[] | select(.conclusion != "failure" and .conclusion != "cancelled")] | length')
          [ "$inflight" = 0 ] \
            || { echo "::error::apk.yml already has a run on $tag; re-run a failed one by hand instead of pressing again"; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Build and publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.pick.outputs.tag }}
          IOS_RELEASE_ENABLED: ${{ vars.IOS_RELEASE_ENABLED }}
        run: |
          set -euo pipefail
          {
            echo "Shipping $TAG."
            echo "If a build below fails, do not press this button again: it would"
            echo "dispatch both builds, and the one that passed would fail on the"
            echo "build number it already used. Re-run only the failed workflow by"
            echo "hand with \`$TAG\` as its ref."
          } >> "$GITHUB_STEP_SUMMARY"
          gh workflow run apk.yml --ref "$TAG"
          echo "apk.yml is building it: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/workflows/apk.yml" >> "$GITHUB_STEP_SUMMARY"
          # iOS only once its Infisical identity and App Store Connect key
          # exist; until then every release would start a macOS job bound to
          # fail. A failed ipa is re-run by hand on the tag, like apk.
          if [ "$IOS_RELEASE_ENABLED" = true ]; then
            gh workflow run ipa.yml --ref "$TAG"
            echo "ipa.yml is uploading it to TestFlight: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/workflows/ipa.yml" >> "$GITHUB_STEP_SUMMARY"
          fi
