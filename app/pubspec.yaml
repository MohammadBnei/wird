name: wird
description: "Read a set of ayas, recite it in prayer, open any word's root."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.0.3
  crypto: ^3.0.6
  sqflite: ^2.4.2
  sqflite_common_ffi: ^2.3.6
  dio: ^5.9.0
  just_audio: ^0.10.5
  wakelock_plus: ^1.3.2
  url_launcher: ^6.3.2
  app_links: ^7.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # just_audio's own seam: the tests stand a fake platform behind the player,
  # so a tap can be watched against a clip that ends when a real one would.
  just_audio_platform_interface: ^4.6.0

flutter:
  uses-material-design: true

  assets:
    - assets/corpus.db

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
    - family: Scheherazade New
      fonts:
        - asset: assets/fonts/ScheherazadeNew-Regular.ttf
